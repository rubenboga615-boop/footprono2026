name: Application

# Application Flutter : vérifications, tests, puis APK Android et version web
# (téléchargeables dans l'onglet Actions, rubrique « Artifacts » de l'exécution).
on:
  push:
    branches: [main, "claude/**"]
    paths: ["app/**", "backend/**", "e2e/**", "console-android/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "backend/**", "e2e/**", "console-android/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed -l 110 lib test
      - run: flutter analyze
      - run: flutter test
      - name: Version web (servie par l'API sur /app)
        run: flutter build web --release --base-href /app/ --no-web-resources-cdn
      - name: Clé de signature de production (secrets du dépôt)
        # Secrets : FP_KEYSTORE_BASE64, FP_KEYSTORE_PASSWORD, FP_KEY_ALIAS,
        # FP_KEY_PASSWORD (docs/APPLICATION.md). Sans eux : clé de développement.
        env:
          KEYSTORE_BASE64: ${{ secrets.FP_KEYSTORE_BASE64 }}
          FP_KEYSTORE_PASSWORD: ${{ secrets.FP_KEYSTORE_PASSWORD }}
          FP_KEY_ALIAS: ${{ secrets.FP_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Pas de clé de production : APK signé avec la clé de développement."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/footprono-release.jks"
          # Empreintes publiques du certificat (rien de secret) : contrôle que c'est la bonne
          # clé, et à coller dans Firebase (connexion Google, docs/APPLICATION.md).
          keytool -list -v -keystore "$RUNNER_TEMP/footprono-release.jks" \
            -storepass "$FP_KEYSTORE_PASSWORD" -alias "$FP_KEY_ALIAS" | grep -E "SHA1:|SHA256:"
          echo "FP_KEYSTORE_FILE=$RUNNER_TEMP/footprono-release.jks" >> "$GITHUB_ENV"
      - name: APK Android
        # Serveur distant intégré à l'APK : variable FP_SERVER_URL du dépôt
        # (Settings → Secrets and variables → Actions → Variables), sinon Termux.
        env:
          FP_KEYSTORE_PASSWORD: ${{ secrets.FP_KEYSTORE_PASSWORD }}
          FP_KEY_ALIAS: ${{ secrets.FP_KEY_ALIAS }}
          FP_KEY_PASSWORD: ${{ secrets.FP_KEY_PASSWORD }}
        # Numéro de construction = numéro de l'exécution : toujours croissant (mises à
        # jour par-dessus) et comparé par l'application à GET /app/version.
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} \
            --dart-define=FP_SERVER=${{ vars.FP_SERVER_URL }} --dart-define=FP_BUILD=${{ github.run_number }}
          echo '{"build": ${{ github.run_number }}, "commit": "${{ github.sha }}"}' \
            > build/app/outputs/flutter-apk/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: footprono-apk
          path: |
            app/build/app/outputs/flutter-apk/*-release.apk
            app/build/app/outputs/flutter-apk/release.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: footprono-web
          path: app/build/web
          if-no-files-found: error

  # Console d'administration installable (console-android) : fenêtre Android sur
  # /admin du serveur FP_SERVER_URL, signée avec la même clé que l'application.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Clé de signature de production (secrets du dépôt)
        env:
          KEYSTORE_BASE64: ${{ secrets.FP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Pas de clé de production : console signée avec la clé de développement."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/footprono-release.jks"
          echo "FP_KEYSTORE_FILE=$RUNNER_TEMP/footprono-release.jks" >> "$GITHUB_ENV"
      - name: APK de la console
        env:
          FP_KEYSTORE_PASSWORD: ${{ secrets.FP_KEYSTORE_PASSWORD }}
          FP_KEY_ALIAS: ${{ secrets.FP_KEY_ALIAS }}
          FP_KEY_PASSWORD: ${{ secrets.FP_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -Pfp.server=${{ vars.FP_SERVER_URL }} -Pfp.build=${{ github.run_number }}
          mv app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/footproba-console.apk
      - uses: actions/upload-artifact@v4
        with:
          name: footproba-console-apk
          path: console-android/app/build/outputs/apk/release/footproba-console.apk
          if-no-files-found: error

  # Parcours de bout en bout : vraie API (PostgreSQL, Redis) + application web
  # dans Chromium (inscription → matchs → pari → bookmaker → montante…).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: footprono
          POSTGRES_PASSWORD: footprono
          POSTGRES_DB: footprono_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U footprono" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      FP_DATABASE_URL: postgresql+asyncpg://footprono:footprono@localhost:5432/footprono_e2e
      FP_REDIS_URL: redis://localhost:6379/0
      FP_SECRET_KEY: cle-de-test-e2e-uniquement-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: API (versions verrouillées), base migrée et données d'essai
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          alembic upgrade head
          python ../e2e/seed.py
      - name: Version web
        working-directory: app
        run: flutter build web --release --base-href /app/ --no-web-resources-cdn
      - name: Démarrage de l'API (sert aussi la version web)
        working-directory: backend
        env:
          FP_WEB_APP_DIR: ${{ github.workspace }}/app/build/web
        run: |
          nohup uvicorn footprono.main:create_app --factory --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/ready && break; sleep 1; done
      - name: Parcours dans Chromium
        working-directory: e2e
        env:
          E2E_URL: http://127.0.0.1:8000/app/
          E2E_SHOTS: shots
        run: |
          mkdir -p shots
          npm ci
          npx playwright install --with-deps chromium
          node app.test.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-captures
          path: |
            e2e/shots
            api.log
