name: Application

# Application Flutter : vérifications, tests, puis APK Android et version web
# (téléchargeables dans l'onglet Actions, rubrique « Artifacts » de l'exécution).
on:
  push:
    branches: [main, "claude/**"]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed -l 110 lib test
      - run: flutter analyze
      - run: flutter test
      - name: Version web (servie par l'API sur /app)
        run: flutter build web --release --base-href /app/ --no-web-resources-cdn
      - name: APK Android
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: footprono-apk
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: footprono-web
          path: app/build/web
          if-no-files-found: error
