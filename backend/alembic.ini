[alembic]
script_location = %(here)s/src/footprono/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
# L'URL de connexion vient de FP_DATABASE_URL (voir migrations/env.py),
# jamais de ce fichier.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
